name: Deploy QA (DigitalOcean)

# Al hacer merge de dev a qa: probar, construir la imagen, publicarla en GHCR y
# reemplazarla en el droplet por SSH. La credencial de Firebase (dev) NO pasa por
# aquí: vive en el droplet (/opt/taxiapp/secrets) y compose la monta.
#
# Redesplegar o volver atrás a mano: Actions > Deploy QA > Run workflow, con el
# sha de un despliegue anterior en `redeploy_sha`.

on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      redeploy_sha:
        description: "Sha completo de una imagen ya publicada (vacío = construir HEAD)"
        required: false
        default: ""

# Nunca dos despliegues a la vez, y uno en curso no se cancela a medias.
concurrency:
  group: deploy-qa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.redeploy_sha == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers usa el Docker del runner.
      - name: Tests
        run: mvn -B test

  build:
    needs: test
    if: ${{ inputs.redeploy_sha == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Referencia de la imagen
        id: ref
        run: |
          # GHCR exige minúsculas.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${GITHUB_REPOSITORY,,}:qa" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El Dockerfile ya compila el jar (multi-stage): no se hace un `mvn package`
      # aparte para no compilar dos veces.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          # Vincula el paquete con este repo: permite que el GITHUB_TOKEN lo lea.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Corre si se construyó, o si es un redespliegue manual (build queda omitido).
    if: >-
      ${{ always() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && inputs.redeploy_sha != '')) }}
    runs-on: ubuntu-latest
    environment: qa
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.DROPLET_HOST }}
      SSH_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Huella fijada: si el host cambia, el despliegue falla en vez de
          # confiar a ciegas en quien responda en esa IP.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n' > ~/.ssh/config

      - name: Subir compose.yaml y ops/
        run: |
          scp -r compose.yaml ops "$SSH_USER@$SSH_HOST:/opt/taxiapp/"

      - name: Desplegar
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          REDEPLOY_SHA: ${{ inputs.redeploy_sha }}
        run: |
          if [ -n "$REDEPLOY_SHA" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${REDEPLOY_SHA}"
          else
            IMAGE="$BUILT_IMAGE"
          fi
          echo "Desplegando $IMAGE"
          # El token viaja por stdin (no queda en argumentos ni en el historial).
          printf '%s\n' "$GHCR_TOKEN" | ssh "$SSH_USER@$SSH_HOST" \
            "chmod +x /opt/taxiapp/ops/*.sh && /opt/taxiapp/ops/deploy.sh '$IMAGE' '$GHCR_USER'"
