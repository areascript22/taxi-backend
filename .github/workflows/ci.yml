name: CI

# Red de seguridad ANTES del merge: los tests corren en cada PR hacia dev y qa.

on:
  pull_request:
    branches: [dev, qa]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: mvn -B test
