spring.application.name=taxiapp
spring.profiles.active=dev

# Configuración local que NO se versiona (secrets/ está en .gitignore y en
# .dockerignore). Hoy solo trae los datos del fundador (taxiapp.admin.*).
# "optional:" -> si el archivo no existe, el servidor arranca igual.
spring.config.import=optional:file:./secrets/taxiapp-secrets.properties

# Copy de las push notifications (messages.properties / messages_en.properties).
# fallback-to-system-locale=false es lo que hace predecible el fallback: sin
# esto, un idioma sin bundle propio caería al locale de la JVM del servidor
# (el del contenedor, que no tiene nada que ver con el del usuario) antes de
# caer al bundle por defecto.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Base de datos: Postgres + PostGIS ---
# La URL y las credenciales NO se fijan acá: en desarrollo las pone
# application-dev.properties (contra el contenedor de compose.dev.yaml) y en el
# servidor las inyecta compose con SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
#
# Pool chico a propósito: el servidor corre en un droplet de 2 GB junto a
# Postgres, y max_connections de la base es 30.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
# Flyway es el único dueño del esquema (src/main/resources/db/migration).
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate NUNCA modifica el esquema. "validate" hace que el servidor se
# niegue a arrancar si una entidad no coincide con las tablas: se entera uno al
# arrancar y no con un error en medio de una petición.
spring.jpa.hibernate.ddl-auto=validate
# Sin "open session in view": cada caso de uso decide sus transacciones, y no
# se pueden hacer consultas perezosas desde un controller.
spring.jpa.open-in-view=false
# Las fechas (Instant) se guardan y leen siempre en UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Firebase (ver FirebaseProperties) ---
# Tiempo máximo de cada operación contra Realtime Database / Firestore.
firebase.operation-timeout=15s

# --- Carreras (ver TaxiappProperties.Rides) ---
# Mayor que el timeout del diálogo "Buscando conductor" de passenger_app (30 s):
# normalmente cancela el cliente y el backend solo cubre el caso de que el
# pasajero haya cerrado la app.
taxiapp.rides.pending-request-expiry=35s
# Margen para que ambas apps lean el estado final antes de borrar el nodo.
taxiapp.rides.terminal-cleanup-delay=10s

# --- Chat (ver TaxiappProperties.Chat) ---
taxiapp.chat.max-message-length=1000
taxiapp.chat.push-preview-length=80
# Debe coincidir con lo que se espera de la política TTL de Firestore sobre expireAt.
taxiapp.chat.retention=7d

# --- Despacho por cercanía (ver DispatchProperties) ---
# Los radios y las esperas por anillo NO van acá: los edita un administrador en
# las tablas dispatch_rings / dispatch_settings.
#
# enabled: el servidor busca conductores cercanos y les deja la oferta en su
#   bandeja (driver_offers/{uid}). Es ADITIVO: las apps viejas siguen viendo todos
#   los pedidos, así que va activo.
# enforce-offers: solo acepta quien recibió la oferta, y si nadie acepta tras el
#   último anillo la solicitud se cierra con "no hay vehículos". Rompe a las apps
#   viejas: activarlo DESPUÉS de subir la versión mínima de driver_app.
#   (variable de entorno: TAXIAPP_DISPATCH_ENFORCEOFFERS=true)
taxiapp.dispatch.enabled=true
taxiapp.dispatch.enforce-offers=false

# --- Versión mínima de las apps (ver appversion/) ---
# Una app por debajo de min-version no puede seguir usándose: las apps muestran
# una pantalla de "actualiza" y no avanzan. 0.0.0 = no bloquea a nadie, que es
# el valor seguro por defecto. Súbela SOLO cuando un cambio del servidor deje de
# ser compatible con las versiones viejas, y después de publicar la nueva en la
# tienda. Se puede sobreescribir sin tocar el código:
#   TAXIAPP_APPVERSIONS_DRIVER_MINVERSION=1.0.8
taxiapp.app-versions.driver.min-version=0.0.0
taxiapp.app-versions.driver.store-url=https://play.google.com/store/apps/details?id=com.areascript.driver_app
taxiapp.app-versions.passenger.min-version=0.0.0
taxiapp.app-versions.passenger.store-url=https://play.google.com/store/apps/details?id=com.areascript.passenger_app

# --- Fundador del proyecto (ver TaxiappProperties.Admin) ---
# Vacíos a propósito: los valores reales van en secrets/taxiapp-secrets.properties
# (local) o en las variables de entorno TAXIAPP_ADMIN_FOUNDER_UID y
# TAXIAPP_ADMIN_FOUNDER_EMAIL (servidor).
taxiapp.admin.founder-uid=
taxiapp.admin.founder-email=
