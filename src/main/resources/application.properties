spring.application.name=taxiapp
spring.profiles.active=dev

# Configuración local que NO se versiona (secrets/ está en .gitignore y en
# .dockerignore). Hoy solo trae los datos del fundador (taxiapp.admin.*).
# "optional:" -> si el archivo no existe, el servidor arranca igual.
spring.config.import=optional:file:./secrets/taxiapp-secrets.properties

# Copy de las push notifications (messages.properties / messages_en.properties).
# fallback-to-system-locale=false es lo que hace predecible el fallback: sin
# esto, un idioma sin bundle propio caería al locale de la JVM del servidor
# (el del contenedor, que no tiene nada que ver con el del usuario) antes de
# caer al bundle por defecto.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Firebase (ver FirebaseProperties) ---
# Tiempo máximo de cada operación contra Realtime Database / Firestore.
firebase.operation-timeout=15s

# --- Carreras (ver TaxiappProperties.Rides) ---
# Mayor que el timeout del diálogo "Buscando conductor" de passenger_app (30 s):
# normalmente cancela el cliente y el backend solo cubre el caso de que el
# pasajero haya cerrado la app.
taxiapp.rides.pending-request-expiry=35s
# Margen para que ambas apps lean el estado final antes de borrar el nodo.
taxiapp.rides.terminal-cleanup-delay=10s

# --- Chat (ver TaxiappProperties.Chat) ---
taxiapp.chat.max-message-length=1000
taxiapp.chat.push-preview-length=80
# Debe coincidir con lo que se espera de la política TTL de Firestore sobre expireAt.
taxiapp.chat.retention=7d

# --- Fundador del proyecto (ver TaxiappProperties.Admin) ---
# Vacíos a propósito: los valores reales van en secrets/taxiapp-secrets.properties
# (local) o en las variables de entorno TAXIAPP_ADMIN_FOUNDER_UID y
# TAXIAPP_ADMIN_FOUNDER_EMAIL (servidor).
taxiapp.admin.founder-uid=
taxiapp.admin.founder-email=
