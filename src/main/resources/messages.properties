# Copy de las push notifications -- ESPAÑOL, y a la vez el bundle POR DEFECTO.
#
# Que el español viva en `messages.properties` (sin sufijo) y no en
# `messages_es.properties` es a propósito: con
# `spring.messages.fallback-to-system-locale=false`, cualquier idioma que no
# tenga bundle propio cae acá. Así un documento viejo sin el campo `language`,
# un valor basura o un idioma que todavía no traducimos reciben el push en
# español en vez de fallar o salir vacíos.
#
# El idioma del destinatario sale de `drivers/{uid}.language` /
# `passengers/{uid}.language`, que las apps escriben junto al fcmToken (ver
# CLAUDE.md seccion 10.1 de cada app). NO sale del request: el push casi
# siempre va dirigido al OTRO participante, no a quien disparó la acción.
#
# Al agregar una key acá hay que agregarla en messages_en.properties también.

push.ride.accepted.title=¡Carrera aceptada!
push.ride.accepted.body=Un conductor va en camino a recogerte

push.ride.cancelledByPassenger.title=Carrera cancelada
push.ride.cancelledByPassenger.body=El pasajero canceló la carrera

push.ride.cancelledByDriver.title=Viaje cancelado
push.ride.cancelledByDriver.body=Tu conductor canceló el viaje

# El body de estos dos es el mensaje que escribió el usuario, así que no se
# traduce (ver PushNotificationDTO.withUserText).
push.chat.fromDriver.title=Tu conductor te escribió
push.chat.fromPassenger.title=Tu pasajero te escribió
